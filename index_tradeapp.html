<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>24 Counter Buttons with CSV Presets</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            width: 1500px;
            margin: 0 auto; /* optional: zentriert den Container */
        }
        .counter-box {
            display: flex;
            flex-direction: column; /* Stack buttons vertically */
            align-items: center;
            padding: 4.5px;
            border-radius: 5px;
            box-shadow: 1px 1px 3px rgba(0, 0, 0, 0.1);
            font-size: 14px;
            margin: 5px; /* Space between counter boxes */
        }
        button {
            font-size: 12px;
            padding: 3px 6px;
            cursor: pointer;
        }
        .counter {
            font-size: 14px;
            min-width: 30px;
            text-align: center;
            font-weight: bold;
            margin: 5px 0; /* Space between counter and buttons */
        }
        iframe {
            /* width: 90%; */
            width: 1400px;
            height: 600px;
            border: none;
        }
    </style>
</head>
<body>

    <h1>Click Tool</h1>
    <!-- <p>Upload a CSV file to load preset values.</p> -->

    <input type="file" id="csvFileInput" accept=".csv" onchange="loadCSV(event)">
    <br><br>
    <iframe src="heatmaps/CH-Imbalance 1h.html"></iframe>
    <iframe src="heatmaps/CH-Imbalance 1h avg.html"></iframe>
    <div class="container" id="counterContainer24"></div>
    <iframe src="tradeviews/Tempview.html"></iframe>
    <div class="container" id="counterContainer9"></div>
    <iframe src="tradeviews/IRRview.html"></iframe>
    <div class="container" id="counterContainer9"></div>
    <br>

    <button onclick="downloadCSV()">📥 Download Final Values as CSV</button>

    <script>
        const numCounters24 = 24;
        const numCounters9 = 9;
    
        let counters24 = new Array(numCounters24).fill(0);
        let counters9 = new Array(numCounters9).fill(0);
    
        function createCounters(containerId, countersArray, prefix) {
            const container = document.getElementById(containerId);
            container.innerHTML = "";
    
            for (let i = 0; i < countersArray.length; i++) {
                let counterBox = document.createElement("div");
                counterBox.classList.add("counter-box");
    
                let minusBtn = document.createElement("button");
                minusBtn.textContent = "➖";
                minusBtn.onclick = () => updateCounter(prefix, i, -1);
    
                let counterDisplay = document.createElement("span");
                counterDisplay.textContent = countersArray[i];
                counterDisplay.classList.add("counter");
                counterDisplay.id = `${prefix}-counter-${i}`;
    
                let plusBtn = document.createElement("button");
                plusBtn.textContent = "➕";
                plusBtn.onclick = () => updateCounter(prefix, i, 1);
    
                counterBox.appendChild(plusBtn);
                counterBox.appendChild(counterDisplay);
                counterBox.appendChild(minusBtn);
                container.appendChild(counterBox);
            }
        }
    
        function updateCounter(prefix, index, value) {
            let counters = prefix === "c24" ? counters24 : counters9;
            counters[index] += value;
            document.getElementById(`${prefix}-counter-${index}`).textContent = counters[index];
        }
    
        function loadCSV(event) {
            const file = event.target.files[0];
            if (!file) return;
    
            const reader = new FileReader();
            reader.onload = function (e) {
                const lines = e.target.result.split("\n").slice(1); // Remove header
                lines.forEach((line) => {
                    const [indexStr, valueStr] = line.split(",");
                    const index = parseInt(indexStr) - 1;
                    const value = parseInt(valueStr) || 0;
    
                    if (index >= 0 && index < counters24.length) {
                        counters24[index] = value;
                    } else if (index >= counters24.length && index < counters24.length + counters9.length) {
                        counters9[index - counters24.length] = value;
                    }
                });
    
                createCounters("counterContainer24", counters24, "c24");
                createCounters("counterContainer9", counters9, "c9");
            };
            reader.readAsText(file);
        }
    
        function downloadCSV() {
            let csvContent = "Counter Index,Final Value\n";
            counters24.forEach((value, index) => {
                csvContent += `${index + 1},${value}\n`;
            });
            counters9.forEach((value, index) => {
                csvContent += `${index + 1 + counters24.length},${value}\n`;
            });
    
            const blob = new Blob([csvContent], { type: "text/csv" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "final_counters.csv";
            a.click();
        }
    
        // Initialisierung
        createCounters("counterContainer24", counters24, "c24");
        createCounters("counterContainer9", counters9, "c9");
    </script>
