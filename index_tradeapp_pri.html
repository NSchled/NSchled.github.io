<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>24 Counter Buttons with CSV Presets</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0px;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            /* justify-content: flex-end; */
            width: 80%;
            margin: 0 auto; /* optional: zentriert den Container */
        }
        .container9Bins {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-evenly;
            width: 85%;
            margin: 0 auto; /* optional: zentriert den Container */
        }
        .counter-box {
            display: flex;
            flex-direction: column; /* Stack buttons vertically */
            align-items: center;
            padding: 4.5px;
            border-radius: 5px;
            box-shadow: 1px 1px 3px rgba(0, 0, 0, 0.1);
            font-size: 14px;
            margin: 5px; /* Space between counter boxes */
        }
        button {
            font-size: 12px;
            padding: 3px 6px;
            cursor: pointer;
        }
        .counter {
            font-size: 14px;
            min-width: 30px;
            text-align: center;
            font-weight: bold;
            margin: 5px 0; /* Space between counter and buttons */
        }
        iframe {
            /* width: 90%; */
            width: 1900px;
            height: 800px;
            border: none;
        }
    </style>
</head>
<body>

    <h1>Spread TradingTool</h1>
    <!-- <p>Upload a CSV file to load preset values.</p> -->



    <input type="file" id="csvFileInput" accept=".csv" onchange="loadCSV(event)">
    <br><br>
    <select id="heatmapSelector" onchange="updateIframe()">
        <option value="file:///H:/views/heatmaps/CH-Imbalance 1h.html">CH-Imbalance 1h</option>
        <option value="file:///H:/views/heatmaps/CH-Imbalance.html">CH-Imbalance</option>
        <option value="file:///H:/views/heatmaps/PRI-Imbalance.html">PRI-Imbalance total 15min</option>
        <!-- print -->
        <!-- <option value="heatmaps/CH-Imbalance Montag.html">CH-Imbalance Montag</option> -->
    </select>
    <br><br>


    <iframe src="file:///H:/views/heatmaps/CH-Imbalance 1h.html"></iframe>
    <div class="container" id="counterContainer24"></div>
    <iframe src="file:///H:/views/tradeviews/Tempview_OP.html"></iframe>
    <div class="container9Bins" id="counterContainer9_OP"></div>
    <iframe src="file:///H:/views/tradeviews/Tempview_PK.html"></iframe>
    <div class="container9Bins" id="counterContainer9_PK"></div>
    <iframe src="file:///H:/views/tradeviews/IRRview_PK.html"></iframe>
    <div class="container9Bins" id="counterContainer9_IRR"></div>
    <br>




    <button onclick="downloadCSV()">📥 Download Final Values as CSV</button>

    <script>
        const numCounters24 = 24;
        const numCounters9 = 9;
    
        let counters24 = new Array(numCounters24).fill(0);
        let counters9_TOP = new Array(numCounters9).fill(0);
        let counters9_TPK = new Array(numCounters9).fill(0)
        let counters9_IRR = new Array(numCounters9).fill(0);
    
        function createCounters(containerId, countersArray, prefix) {
            const container = document.getElementById(containerId);
            container.innerHTML = "";
    
            for (let i = 0; i < countersArray.length; i++) {
                let counterBox = document.createElement("div");
                counterBox.classList.add("counter-box");
                // Schieberegler erstellen
                let slider = document.createElement("input");
                slider.type = "range";
                slider.min = -10; // Passe den Wertebereich nach Bedarf an
                slider.max = 10;
                slider.value = countersArray[i];
                slider.step = 1;
                slider.style.writingMode = "bt-lr"; // Für Firefox
                slider.style.transform = "rotate(270deg)"; // Für andere Browser
                // slider.style.position = "absolute";
                // slider.style.left = "0px";
                // slider.style.top = "10px";
                slider.style.width = "50px";
                slider.style.height = "60px";
                counterBox.style.height = "120px"; 
                counterBox.style.width = "20px"; 
                slider.style.margin = "0px 0";
                slider.oninput = function () {
                    countersArray[i] = parseInt(slider.value);
                    counterDisplay.textContent = countersArray[i];
                    counterBox.style.backgroundColor = getCounterBoxColor(countersArray[i]);
                };
                slider.addEventListener("wheel", function(e) {
                    e.preventDefault();
                    let step = parseInt(slider.step) || 1;
                    if (e.deltaY < 0) {
                        slider.value = Math.min(parseInt(slider.value) + step, parseInt(slider.max));
                    } else {
                        slider.value = Math.max(parseInt(slider.value) - step, parseInt(slider.min));
                    }
                    countersArray[i] = parseInt(slider.value);
                    counterDisplay.textContent = countersArray[i];
                    counterBox.style.backgroundColor = getCounterBoxColor(countersArray[i]);
                });
                counterBox.style.backgroundColor = getCounterBoxColor(countersArray[i]);

                let counterDisplay = document.createElement("span");
                counterDisplay.textContent = countersArray[i];
                counterDisplay.classList.add("counter");
                counterDisplay.id = `${prefix}-counter-${i}`;

                counterBox.appendChild(slider);
                counterBox.appendChild(counterDisplay);
                container.appendChild(counterBox);
            }
        }
    
        function getCounterBoxColor(val) {
            // Blau: #3a7bd5, Weiß: #fff, Braun: #8B4513
            if (val <= 0) {
                // Interpolieren zwischen blau und weiß
                let t = (val + 10) / 10; // -10 => 0, 0 => 1
                // Blau: rgb(58,123,213), Weiß: rgb(255,255,255)
                let r = Math.round(58 + (255 - 58) * t);
                let g = Math.round(123 + (255 - 123) * t);
                let b = Math.round(213 + (255 - 213) * t);
                return `rgb(${r},${g},${b})`;
            } else {
                // Interpolieren zwischen weiß und braun
                let t = val / 10; // 0 => 0, 10 => 1
                // Weiß: rgb(255,255,255), Braun: rgb(139,69,19)
                let r = Math.round(255 + (139 - 255) * t);
                let g = Math.round(255 + (69 - 255) * t);
                let b = Math.round(255 + (19 - 255) * t);
                return `rgb(${r},${g},${b})`;
            }
        }

        function updateCounter(prefix, index, value) {
            let counters;
            if (prefix === "c24") {
                counters = counters24;
            } else if (prefix === "c9_TOP") {
                counters = counters9_TOP;
            } else if (prefix === "c9_TPK") {
                counters = counters9_TPK;
            } else if (prefix === "c9_IRR") {
                counters = counters9_IRR;
            }
            counters[index] += value;
            document.getElementById(`${prefix}-counter-${index}`).textContent = counters[index];
        }
            
        function loadCSV(event) {
            const file = event.target.files[0];
            if (!file) return;
    
            const reader = new FileReader();
            reader.onload = function (e) {
                const lines = e.target.result.split("\n").slice(1); // Remove header
                lines.forEach((line) => {
                    const [indexStr, valueStr] = line.split(",");
                    const index = parseInt(indexStr) - 1;
                    const value = parseInt(valueStr) || 0;
    
                    if (index >= 0 && index < counters24.length) {
                        counters24[index] = value;
                    } else if (index >= counters24.length && index < counters24.length + counters9.length) {
                        counters9[index - counters24.length] = value;
                    }
                });
    
                createCounters("counterContainer24", counters24, "c24");
                // createCounters("counterContainer9", counters9, "c9");
                createCounters("counterContainer9_OP", counters9_TOP, "c9_TOP");
                createCounters("counterContainer9_PK", counters9_TPK, "c9_TPK");
                createCounters("counterContainer9_IRR", counters9_IRR, "c9_IRR");
            };
            reader.readAsText(file);
        }
    
        function downloadCSV() {
            let csvContent = "Counter Index,Input,value\n";
            counters24.forEach((value, index) => {
                csvContent += `${index + 1},c24,${value}\n`;
            });
            counters9_TOP.forEach((value, index) => {
                csvContent += `${index + 1 + counters24.length},c9_TOP,${value}\n`;
            });
            counters9_TPK.forEach((value, index) => {
                csvContent += `${index + 1 + counters24.length + counters9_TOP.length},c9_TPK,${value}\n`;
            });
            counters9_IRR.forEach((value, index) => {
                csvContent += `${index + 1 + counters24.length + counters9_TOP.length + counters9_TPK.length},c9_IRR,${value}\n`;
            });
    
            const blob = new Blob([csvContent], { type: "text/csv" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "final_counters.csv";
            a.click();
        }
    
        // Initialisierung
        createCounters("counterContainer24", counters24, "c24");
        createCounters("counterContainer9_OP", counters9_TOP, "c9_TOP");
        createCounters("counterContainer9_PK", counters9_TPK, "c9_TPK");
        createCounters("counterContainer9_IRR", counters9_IRR, "c9_IRR");

        function updateIframe() {
            const selectedValue = document.getElementById("heatmapSelector").value;
            document.querySelector("iframe").src = selectedValue;
        }

        // JavaScript-Code zum Erstellen der Wochentagsoptionen
        const wochentage = ["Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag", "Sonntag"];
        const selectElement = document.getElementById("heatmapSelector");

        wochentage.forEach(tag => {
            const option = document.createElement("option");
            option.value = `file:///H:/views/heatmaps/PRI-Imbalance ${tag}.html`;
            option.textContent = `PRI-Imbalance ${tag}`;
            selectElement.appendChild(option);
        });

        

    </script>


</body>
</html>
